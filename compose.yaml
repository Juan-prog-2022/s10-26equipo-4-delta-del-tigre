name: ${COMPOSE_PROJECT_NAME:-delta-tigre}

services:
  mysql:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE in .env}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:?Set MYSQL_HOST_PORT in .env}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:?Set REDIS_HOST_PORT in .env}:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    profiles:
      - development
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${IP_ADDRESS:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:?Set JAVA_BUILD_IMAGE in .env}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?Set JAVA_RUNTIME_IMAGE in .env}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:?Set BACKEND_HOST_PORT in .env}:8080"
    environment:
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-delta_tigre}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST:?Set MYSQL_HOST in .env}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}?${MYSQL_JDBC_PARAMS:?Set MYSQL_JDBC_PARAMS in .env}"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in .env}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in .env}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: vscode
    working_dir: /workspaces/hostflow
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspaces/hostflow:cached
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network
    profiles:
      - development

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
